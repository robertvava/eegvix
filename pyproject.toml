[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eegvix"
version = "2.0.0"
description = "EEG-to-Image generation via CLIP-aligned contrastive learning and diffusion models."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Robert Vava", email = "vavarobert10@gmail.com"}]

dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "lightning>=2.1",
    "open-clip-torch>=2.24",
    "diffusers>=0.25",
    "transformers>=4.36",
    "peft>=0.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "torchmetrics>=1.2",
    "lpips>=0.1.4",
    "tqdm>=4.66",
    "einops>=0.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
